<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Client video</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    video { width: 100%; max-height: 90vh; background: #000; }
    #info { padding: 8px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="info">Playing client reference…</div>
  <video id="v" controls autoplay playsinline>
    <source src="/tmp-client-video.mp4" type="video/mp4" />
  </video>
  <script>
    const v = document.getElementById("v");
    const info = document.getElementById("info");
    v.addEventListener("loadedmetadata", () => {
      info.textContent = `duration=${v.duration.toFixed(1)}s ${v.videoWidth}x${v.videoHeight}`;
    });
    v.addEventListener("timeupdate", () => {
      info.textContent = `t=${v.currentTime.toFixed(1)}/${v.duration.toFixed(1)}`;
    });
  </script>
</body>
</html>
